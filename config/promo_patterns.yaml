# Promo / call-to-action patterns for chunk.promo_candidate.
# Case-insensitive Python regexes, matched against a chunk's clean text.
# A hit only FLAGS the chunk (promo_hits lists the ids); nothing is dropped.
# thpstrength.com is the only "...strength.com" site in the corpus. thp-ai's
# cleaning rules normalise most caption spellings ("teachbstrength.com") to it;
# the rest are split across segments ("go to THP" | "Strength.com"), so match
# any "strength.com" rather than the full name.

patterns:
  - id: thp_site
    regex: '(?:strength|strike)\s?(?:\.|\s?dot\s?)\s?com\b'
  - id: link_in_description
    regex: '\blinks? (?:is |are )?(?:down )?(?:in|below in) (?:the|my|our) description\b|\bin the description(?: below| box)?\b|\bdescription below\b'
  - id: pinned_comment
    regex: '\bpinned comment\b'
  - id: use_code
    regex: '\b(?:use|using) (?:the |my |our )?(?:discount |promo )?code\b|\b(?:discount|promo|coupon) code\b'
  - id: sponsor
    regex: '\bsponsor\w*'
  - id: sign_up
    regex: '\bsign(?:ing|ed)? up\b'
  - id: first_month_offer
    regex: '(?:\d+ ?%|percent) off (?:of )?(?:your |the )?first month|\bfirst month\b.{0,80}\brefund|\brefund\b.{0,80}\bfirst month\b'
  - id: coaching_program
    regex: '\bcoaching program\b|\bonline coaching\b|\bget coached by (?:me|us)\b|\bdiagnosis call\b|\bset up a call\b'
  - id: like_subscribe
    regex: '\blike,? comment,? (?:and )?subscribe\b|\bsubscribe to (?:the|my|our|this) channel\b'
