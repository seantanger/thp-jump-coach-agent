[project]
name = "jump-coach-agent"
version = "0.1.0"
description = "Vertical-jump coaching agent grounded in John Evans + THP Strength transcripts (WatSPEED Agentic AI project)"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
