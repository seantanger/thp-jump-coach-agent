# Drafted 2026-10-30 by Claude from the transcripts only (not the Google Drive sheets).
# Main source: John Evans – How to Get a 40" Vertical (Full Blueprint), Icml891MLHA (2026-03-22).
# Numbers keep the transcript's unit. Notes paraphrase; no quotes.
id: long_conjugate_6mo
name: Six-month long conjugate macrocycle (40" Blueprint)
kind: macrocycle
model: long_conjugate
sources: [Icml891MLHA, bFezqBUmWO4, ZxzFvqBlzYw, HWx9Q6gLxg8, Hhl7vONBAEs, JoXfKavjn8g]

defaults:
  values:
    macrocycle_months: 6
    mesocycles: 6
    example_lift_days: [mon, wed, fri]
    example_general_days: [tue, thu]
    training_days_note: "About 3 days a week in month 1, with general days (Tue/Thu) between Mon/Wed/Fri lifts. Not strict: 'about'."
    hard_days_per_week: "Hard days are lift and jump days; recovery takes 48-72 h. 2-4 per week: 3 lift days + 1 jump session when the athlete feels good, recovers well and has no heavy sport load (4 hard days is about the most THP uses - more and athletes go flat); 2 lift days + 1 jump session when beat up, short on time, in season or playing a lot (e.g. Mon/Thu/Sat). One hard day a week is only maintenance. Capacity to handle more grows with training, so move up when the athlete handles the current load well."
    general_days: "Easy movement on top of the hard days (bodyweight or bodybuilding circuits, tempo, upper body, core); optional, and the first thing dropped when days are short."
    jump_session_frequency: "About once a week; THP plans often put it on Saturday after Mon/Wed/Fri lifting (Friday in an unload week)."
    jump_session_window_min: 40
    jump_session_progression: "Start ~35 min low-effort + 5 min max-effort; each mesocycle move 5 min from warm-up jumps to max-effort jumps; cap at 20/20."
    session_order: "Power exercise first, then squats, then accessories."
    principle_general_vs_specific: "As the specific days get more specific, the general days get more general; everything intense and specific at once gets you hurt."
    principle_accessories_prime_next: "Accessory work in each month primes the main lifts of the next month."
    unload_timing: "Unload about one week every 3-4 weeks of hard training: volume down about 60%, intensity kept high (bars fast, sprints and some plyos stay). Not the same as a taper or doing nothing."
    unload_week_example: "John Evans special: Monday 5x2 power cleans to a heavy double, heavy slow squats (not too hard), 2x10 calves and hamstrings; Wednesday 4x6 slow quarter squats (one-foot) or half squats (two-foot), 2x10 band walks, slow calf raises; Friday a high-quality jump session as a barometer. Keep it general: no heavy eccentrics, nothing very fast except the cleans. No long extra dunk sessions during the unload."
    unload_by_feel: "Ask how the athlete feels before a planned unload. Beat up or very sore, or jumps trending down for weeks -> unload now (week 3). Feeling fresh, lifts still progressing, no joint pain -> unload at week 4 and may use a half unload (volume x0.5). Still thrashed after the unload week -> another unload week, or go back to volume. Never skip the unload altogether; feel moves it within 3-4 weeks."
  cites: [Icml891MLHA@35#0, Icml891MLHA@105#0, Icml891MLHA@174#0, Icml891MLHA@209#0, Icml891MLHA@282#0,
          Icml891MLHA@354#0, Icml891MLHA@647#0, Icml891MLHA@792#0, Icml891MLHA@830#0, E-KBmRDuh8o@780#0,
