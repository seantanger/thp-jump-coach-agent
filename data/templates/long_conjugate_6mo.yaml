gates:
  - id: beat_up_before_unload
    track: macro
    signal: readiness
    condition: Athlete feels beat up or very sore, or jumps have trended down for weeks, after hard loading.
    decision: unload
    cites: [6P6ONA5ELyA@571#0, 6P6ONA5ELyA@604#0, _C8nl0YN5M4@280#0]
  - id: struggling_with_hard_days
    track: macro
    signal: readiness
    condition: Mid-cycle the athlete feels run down, recovers poorly between lifts, or has a heavy sport week - drop to 2 lift days + 1 jump session, about 72 h apart.
    decision: step_back
    cites: [rmQ1cQFaBlM@556#0, rmQ1cQFaBlM@932#0, rmQ1cQFaBlM@972#0, _C8nl0YN5M4@184#0]
  - id: handling_hard_days_well
    track: macro
    signal: readiness
    condition: The athlete feels good, recovers well and lifts keep progressing on 2 lift days - move up to 3 lift days + 1 jump session (about 4 hard days at most).
    decision: progress
    cites: [rmQ1cQFaBlM@594#0, rmQ1cQFaBlM@1232#0, _C8nl0YN5M4@481#0]
  - id: fresh_at_planned_unload
    track: macro
    signal: readiness
    condition: Feels fresh, lifts still progressing and no joint pain at week 3 - keep loading one more week, then unload (a half unload at x0.5 is fine).
    decision: progress
    cites: [ZxzFvqBlzYw@38#0, Idz2nL2DARw@189#0, Idz2nL2DARw@240#0]
  - id: still_thrashed_after_unload
    track: macro
    signal: readiness
    condition: Still thrashed after the unload week.
    decision: unload
    cites: [UM-FzQ4qm5Q@158#0]
  - id: unload_jump_session_low
    track: macro
    signal: jump_session
    condition: The unload week's jump session is very low - still fatigued (often an extra long dunk session or a too-heavy Monday); keep the volume down.
    decision: hold
    cites: [6P6ONA5ELyA@323#0, 6P6ONA5ELyA@467#0]

review:
  drafted: 2026-10-30
  reviewed_by_user: true
  notes: "Taper content: cut volume ~50% (50-70% in the taper video), raise intensity, more frequent max-effort jumping, 5-4-3-2-1 squats, daily max for velocity on the power clean. 2026-11-06 review: months 4-6 set to 4 weeks (user); jump session weekly after the last lift day; unload timing and depth follow how the athlete feels within THP's 3-4 weeks (user); feel-based gates added, applied by code in plan 2. Training days: 2-4 hard days by how the athlete handles them, general days optional (user + THP 3-vs-6-days and frequency podcasts). Half unload (x0.5) comes from John's own training vlog, weaker than the other sources."
