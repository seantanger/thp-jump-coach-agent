[project]
name = "jump-coach-agent"
version = "0.1.0"
description = "Vertical-jump coaching agent grounded in John Evans + THP Strength transcripts (WatSPEED Agentic AI project)"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
ui = ["streamlit>=1.40"]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
